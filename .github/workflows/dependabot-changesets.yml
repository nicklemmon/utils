name: Dependabot changesets

on: # zizmor: ignore[dangerous-triggers] -- Run only default-branch code. Read PR files as data through the API.
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr-number:
        description: Open Dependabot PR number
        type: number
        required: true
      preview:
        description: Preview without committing
        type: boolean
        default: true

permissions: {}

concurrency:
  group: dependabot-changesets-${{ github.event.pull_request.number || inputs.pr-number }}
  cancel-in-progress: false

jobs:
  changesets:
    if: >-
      github.repository == 'nicklemmon/utils' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.pull_request.user.login == 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}
      CHANGESET_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      # Always run trusted default-branch code. Read PR files through the API.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Plan changeset
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGESET_MODE: preview
        run: npm run --silent generate --workspace=@repo/dependency-changesets
      - name: Create changeset token
        id: app
        if: >-
          steps.plan.outputs.changed == 'true' &&
          (github.event_name != 'workflow_dispatch' || !inputs.preview)
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.DEPENDENCY_CHANGESETS_APP_ID }}
          private-key: ${{ secrets.DEPENDENCY_CHANGESETS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
      - name: Commit changeset
        if: steps.app.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CHANGESET_MODE: publish
        run: npm run --silent generate --workspace=@repo/dependency-changesets

  auto-merge:
    needs: changesets
    if: github.event_name == 'pull_request_target'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/dependabot-auto-merge.yml # zizmor: ignore[self-repository] -- The pinned actionlint version requires this syntax.
